[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgddl"
version = "0.1.0"
description = "Export PostgreSQL schema definitions as executable SQL."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Evan Q" }]
keywords = ["postgresql", "ddl", "schema", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/p-v-q/pgddl"
Issues = "https://github.com/p-v-q/pgddl/issues"

[project.scripts]
pgddl = "pgddl.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
